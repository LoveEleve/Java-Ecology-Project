spring:
  application:
    name: java-ecology-lucene
app:
  lucene:
    path: ${LUCENE_INDEX_PATH:./data/lucene-index}
    commit-on-write: true

server:
  port: 8092
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
