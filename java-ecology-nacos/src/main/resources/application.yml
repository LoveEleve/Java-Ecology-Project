spring:
  application:
    name: java-ecology-nacos
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

server:
  port: 8087
  shutdown: graceful

ecology:
  nacos:
    message: local-default
    group: ECO_ECOLOGY
    publish-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
