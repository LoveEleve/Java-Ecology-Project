syntax = "proto3";

package ecology.grpc;

option java_package = "com.loveeleve.ecology.grpc.api";
option java_multiple_files = true;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderReply);
  rpc StreamOrders (StreamOrdersRequest) returns (stream OrderReply);
  rpc UploadOrders (stream CreateOrderRequest) returns (UploadSummary);
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
}

message CreateOrderRequest {
  string request_id = 1;
  int64 user_id = 2;
  int64 product_id = 3;
  string amount = 4;
  int32 quantity = 5;
}

message OrderReply {
  int64 order_id = 1;
  string status = 2;
  string request_id = 3;
}

message StreamOrdersRequest {
  int32 count = 1;
}

message UploadSummary {
  int32 accepted = 1;
  string request_id = 2;
}

message ChatMessage {
  string user = 1;
  string text = 2;
}
