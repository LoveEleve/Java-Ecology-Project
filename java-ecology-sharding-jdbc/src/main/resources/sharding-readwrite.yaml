rules:
- !READWRITE_SPLITTING
  dataSourceGroups:
    ds_0:
      writeDataSourceName: ds_0_master
      readDataSourceNames:
        - ds_0_slave
      loadBalancerName: round_robin
    ds_1:
      writeDataSourceName: ds_1_master
      readDataSourceNames:
        - ds_1_slave
      loadBalancerName: round_robin
  loadBalancers:
    round_robin:
      type: ROUND_ROBIN
- !SHARDING
  tables:
    t_order:
      actualDataNodes: ds_${0..1}.t_order_${0..1}
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: order_database_inline
      tableStrategy:
        standard:
          shardingColumn: order_id
          shardingAlgorithmName: order_table_inline
  shardingAlgorithms:
    order_database_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${user_id % 2}
    order_table_inline:
      type: INLINE
      props:
        algorithm-expression: t_order_${order_id % 2}
props:
  sql-show: false
