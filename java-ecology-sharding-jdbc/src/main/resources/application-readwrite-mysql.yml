app:
  readwrite:
    init-schema: false
    datasources:
      ds0master:
        url: jdbc:mysql://${MYSQL_RW_DS0_MASTER_HOST:127.0.0.1}:${MYSQL_RW_DS0_MASTER_PORT:3306}/${MYSQL_RW_DS0_MASTER_DB:ecology_ds0}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
