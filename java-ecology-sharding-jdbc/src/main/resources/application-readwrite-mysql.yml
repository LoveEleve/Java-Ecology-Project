        username: ${MYSQL_RW_DS0_MASTER_USER:ecology}
        password: ${MYSQL_RW_DS0_MASTER_PASSWORD:ecology}
      ds0slave:
        url: jdbc:mysql://${MYSQL_RW_DS0_SLAVE_HOST:127.0.0.1}:${MYSQL_RW_DS0_SLAVE_PORT:3306}/${MYSQL_RW_DS0_SLAVE_DB:ecology_ds0}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
