        username: ${MYSQL_RW_DS0_SLAVE_USER:ecology}
        password: ${MYSQL_RW_DS0_SLAVE_PASSWORD:ecology}
      ds1master:
        url: jdbc:mysql://${MYSQL_RW_DS1_MASTER_HOST:127.0.0.1}:${MYSQL_RW_DS1_MASTER_PORT:3306}/${MYSQL_RW_DS1_MASTER_DB:ecology_ds1}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
