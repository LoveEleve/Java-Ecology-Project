          leak-detection-threshold: 20000
      ds1slave:
        url: jdbc:h2:mem:rw-ds1-slave;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
