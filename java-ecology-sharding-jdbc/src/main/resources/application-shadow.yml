app:
  shadow:
    init-schema: true
    datasources:
      prod:
        url: jdbc:h2:mem:shadow-prod;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
        driver-class-name: org.h2.Driver
        username: sa
        password:
        hikari:
          pool-name: shadow-prod-pool
          maximum-pool-size: 10
          minimum-idle: 2
          connection-timeout: 3000
          validation-timeout: 1000
          idle-timeout: 600000
          max-lifetime: 1800000
          keepalive-time: 60000
          leak-detection-threshold: 20000
      shadow:
        url: jdbc:h2:mem:shadow-copy;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
        driver-class-name: org.h2.Driver
        username: sa
        password:
        hikari:
          pool-name: shadow-copy-pool
          maximum-pool-size: 10
          minimum-idle: 2
          connection-timeout: 3000
          validation-timeout: 1000
          idle-timeout: 600000
          max-lifetime: 1800000
          keepalive-time: 60000
          leak-detection-threshold: 20000
