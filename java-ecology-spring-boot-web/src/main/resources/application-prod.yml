server:
  tomcat:
    accesslog:
      enabled: true
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: logs/java-ecology-web.log
  level:
    root: INFO
    com.loveeleve.ecology.web: INFO
