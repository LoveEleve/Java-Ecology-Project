server:
  tomcat:
    accesslog:
      enabled: false
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,ecology
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.loveeleve.ecology.web: DEBUG
